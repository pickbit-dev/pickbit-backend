spring:
  config:
    activate:
      on-profile: deploy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${AUTH_MYSQL_USERNAME}
    password: ${AUTH_MYSQL_PASSWORD}
    url: ${AUTH_MYSQL_URL}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL}/api/auth/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
          kakao:
            provider: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL}/api/auth/oauth2/code/{registrationId}"
            client-name: Kakao
          naver:
            provider: naver
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL}/api/auth/oauth2/code/{registrationId}"
            scope:
              - email
              - name
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  cloud:
    consul:
      enabled: true
      host: ${CONSUL_HOST:consul-server}
      port: ${CONSUL_PORT:18500}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate

server:
  port: ${AUTH_SERVER_PORT:18081}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:1800000}
  refresh-token-validity-ms: ${JWT_REFRESH_TOKEN_VALIDITY_MS:1209600000}

frontend:
  oauth-callback-url: ${FRONTEND_OAUTH_CALLBACK_URL}
  oauth-signup-url: ${FRONTEND_OAUTH_SIGNUP_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
