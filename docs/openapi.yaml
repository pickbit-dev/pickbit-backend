openapi: 3.0.1
info:
  title: pickbit-backend
  description: ''
  version: ''
paths:
  /api/files/images:
    post:
      tags:
      - File
      summary: 이미지 업로드
      description: 멀티파트 요청으로 여러 개의 이미지 파일을 동시에 업로드할 수 있습니다.업로드 성공 시 각 파일의 접근 URL과
        메타데이터를 반환합니다.
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - files
              type: object
              properties:
                files:
                  type: string
                  description: 업로드할 이미지 파일 목록
                  format: binary
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                description: List
                items:
                  type: object
                  properties:
                    fileUrl:
                      type: string
                    originalFilename:
                      type: string
                    size:
                      type: integer
                      format: int64
  /auctions:
    get:
      tags:
      - Auction
      summary: 경매 목록을 페이징 조회합니다.
      description: ''
      parameters:
      - name: status
        in: query
        description: 경매 상태 필터 (선택). null이면 전체 조회 (SCHEDULED, ACTIVE, ENDED, CANCELLED)
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: array
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        productId:
                          type: integer
                          format: int64
                        productName:
                          type: string
                        productThumbnailUrl:
                          type: string
                        sellerNickname:
                          type: string
                        currentPrice:
                          type: number
                          format: double
                        auctionStatus:
                          type: string
                          description: SCHEDULED, ACTIVE, ENDED, CANCELLED
                        endTime:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                  page:
                    type: integer
                    format: int32
                  size:
                    type: integer
                    format: int32
                  totalElements:
                    type: integer
                    format: int64
                  totalPages:
                    type: integer
                    format: int32
                  first:
                    type: boolean
                  last:
                    type: boolean
                description: PageResponse
    post:
      tags:
      - Auction
      summary: 새 경매를 생성합니다.
      description: <p>요청자가 해당 상품의 판매자여야 하며, 상품은상태이고이이어야 합니다.
      parameters:
      - name: nickname
        in: header
        description: 판매자 닉네임 (요청 헤더)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - endTime
              - minimumBidIncrement
              - productId
              - startTime
              - startingPrice
              type: object
              properties:
                productId:
                  type: integer
                  format: int64
                startingPrice:
                  minimum: !!float '0'
                  type: number
                  format: double
                buyNowPrice:
                  minimum: !!float '0'
                  type: number
                  format: double
                minimumBidIncrement:
                  minimum: !!float '0'
                  type: number
                  format: double
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
              description: 경매 생성 요청 데이터
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  productId:
                    type: integer
                    format: int64
                  productName:
                    type: string
                  productThumbnailUrl:
                    type: string
                  sellerNickname:
                    type: string
                  startingPrice:
                    type: number
                    format: double
                  currentPrice:
                    type: number
                    format: double
                  buyNowPrice:
                    type: number
                    format: double
                  minimumBidIncrement:
                    type: number
                    format: double
                  auctionStatus:
                    type: string
                    description: SCHEDULED, ACTIVE, ENDED, CANCELLED
                  startTime:
                    type: string
                    format: date-time
                  endTime:
                    type: string
                    format: date-time
                  winnerNickname:
                    type: string
                  finalPrice:
                    type: number
                    format: double
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                description: AuctionDetailResponse
  /auctions/{auctionId}:
    get:
      tags:
      - Auction
      summary: 경매 상세 정보를 조회합니다.
      description: ''
      parameters:
      - name: auctionId
        in: path
        description: 경매 ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  productId:
                    type: integer
                    format: int64
                  productName:
                    type: string
                  productThumbnailUrl:
                    type: string
                  sellerNickname:
                    type: string
                  startingPrice:
                    type: number
                    format: double
                  currentPrice:
                    type: number
                    format: double
                  buyNowPrice:
                    type: number
                    format: double
                  minimumBidIncrement:
                    type: number
                    format: double
                  auctionStatus:
                    type: string
                    description: SCHEDULED, ACTIVE, ENDED, CANCELLED
                  startTime:
                    type: string
                    format: date-time
                  endTime:
                    type: string
                    format: date-time
                  winnerNickname:
                    type: string
                  finalPrice:
                    type: number
                    format: double
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                description: AuctionDetailResponse
    delete:
      tags:
      - Auction
      summary: 경매를 취소합니다.
      description: 상태의 경매만 취소할 수 있으며,요청자가 해당 경매의 판매자여야 합니다.
      parameters:
      - name: nickname
        in: header
        description: 판매자 닉네임 (요청 헤더)
        required: true
        schema:
          type: string
      - name: auctionId
        in: path
        description: 취소할 경매 ID
        required: true
        schema:
          type: integer
          format: int64
  /auctions/{auctionId}/bids:
    get:
      tags:
      - Bid
      summary: 경매의 입찰 내역을 금액 내림차순으로 페이징 조회합니다.
      description: ''
      parameters:
      - name: auctionId
        in: path
        description: 경매 ID
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: array
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        auctionId:
                          type: integer
                          format: int64
                        bidderNickname:
                          type: string
                        amount:
                          type: number
                          format: double
                        bidTime:
                          type: string
                          format: date-time
                        bidStatus:
                          type: string
                          description: ACTIVE, OUTBID, WINNING
                  page:
                    type: integer
                    format: int32
                  size:
                    type: integer
                    format: int32
                  totalElements:
                    type: integer
                    format: int64
                  totalPages:
                    type: integer
                    format: int32
                  first:
                    type: boolean
                  last:
                    type: boolean
                description: PageResponse
    post:
      tags:
      - Bid
      summary: 입찰을 제출합니다.
      description: 상태의 경매에만 입찰할 수 있습니다.입찰가는 현재가 + 최소 입찰 단위 이상이어야 하며,판매자 본인은 입찰할 수
        없습니다.즉시 구매가 이상의 금액으로 입찰 시 경매가 즉시 종료됩니다.
      parameters:
      - name: nickname
        in: header
        description: 입찰자 닉네임 (요청 헤더)
        required: true
        schema:
          type: string
      - name: auctionId
        in: path
        description: 경매 ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - bidAmount
              type: object
              properties:
                bidAmount:
                  minimum: !!float '0'
                  type: number
                  format: double
              description: 입찰 요청 데이터
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  auctionId:
                    type: integer
                    format: int64
                  bidderNickname:
                    type: string
                  amount:
                    type: number
                    format: double
                  bidTime:
                    type: string
                    format: date-time
                  bidStatus:
                    type: string
                    description: ACTIVE, OUTBID, WINNING
                description: BidResponse
  /internal/products/{id}/status:
    patch:
      tags:
      - Internal Product
      summary: 상품의 상태를 변경합니다.
      description: <p>경매 종료 시 auction-service가 호출하여 상품 상태를또는(유찰 시 재등록)로 업데이트합니다.
      parameters:
      - name: id
        in: path
        description: 상태를 변경할 상품 ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - status
              type: object
              properties:
                status:
                  type: string
                  description: ACTIVE, INACTIVE, SOLD_OUT, AUCTION_COMPLETED, DELETED
              description: 변경할 상태 정보
        required: false
  /products:
    get:
      tags:
      - Product
      summary: 상품 목록을 조회합니다.
      description: ''
      parameters:
      - name: categoryId
        in: query
        description: 카테고리별 조회를 위한 카테고리 ID
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: array
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        name:
                          type: string
                        startingPrice:
                          type: number
                          format: double
                        productStatus:
                          type: string
                          description: ACTIVE, INACTIVE, SOLD_OUT, AUCTION_COMPLETED,
                            DELETED
                        productCondition:
                          type: string
                          description: NEW, LIKE_NEW, GOOD, FAIR, POOR
                        listingType:
                          type: string
                          description: NORMAL, AUCTION
                        sellerNickname:
                          type: string
                        categoryName:
                          type: string
                        thumbnailUrl:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  page:
                    type: integer
                    format: int32
                  size:
                    type: integer
                    format: int32
                  totalElements:
                    type: integer
                    format: int64
                  totalPages:
                    type: integer
                    format: int32
                  first:
                    type: boolean
                  last:
                    type: boolean
                description: PageResponse
    post:
      tags:
      - Product
      summary: 신규 상품을 등록합니다.
      description: 이미지는 file-service를 통해 사전 업로드 후 URL을 전달합니다.
      parameters:
      - name: nickname
        in: header
        description: 요청한 판매자 닉네임
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - description
              - images
              - listingType
              - name
              - productCondition
              - startingPrice
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                startingPrice:
                  minimum: !!float '0'
                  type: number
                  format: double
                productCondition:
                  type: string
                  description: NEW, LIKE_NEW, GOOD, FAIR, POOR
                listingType:
                  type: string
                  description: NORMAL, AUCTION
                categoryId:
                  type: integer
                  format: int64
                images:
                  type: array
                  items:
                    required:
                    - imageType
                    - imageUrl
                    - sortOrder
                    type: object
                    properties:
                      imageUrl:
                        type: string
                      imageType:
                        type: string
                        description: THUMBNAIL, DETAIL
                      sortOrder:
                        minimum: !!float '0'
                        type: integer
                        format: int32
              description: 등록할 상품 정보 (images 포함)
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  description:
                    type: string
                  price:
                    type: number
                    format: double
                  productStatus:
                    type: string
                    description: ACTIVE, INACTIVE, SOLD_OUT, AUCTION_COMPLETED, DELETED
                  productCondition:
                    type: string
                    description: NEW, LIKE_NEW, GOOD, FAIR, POOR
                  listingType:
                    type: string
                    description: NORMAL, AUCTION
                  sellerNickname:
                    type: string
                  categoryId:
                    type: integer
                    format: int64
                  categoryName:
                    type: string
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        imageUrl:
                          type: string
                        imageType:
                          type: string
                          description: THUMBNAIL, DETAIL
                        sortOrder:
                          type: integer
                          format: int32
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                description: ProductDetailResponse
  /products/{id}:
    get:
      tags:
      - Product
      summary: 상품 상세 정보를 조회합니다.
      description: ''
      parameters:
      - name: id
        in: path
        description: 조회할 상품 ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  description:
                    type: string
                  price:
                    type: number
                    format: double
                  productStatus:
                    type: string
                    description: ACTIVE, INACTIVE, SOLD_OUT, AUCTION_COMPLETED, DELETED
                  productCondition:
                    type: string
                    description: NEW, LIKE_NEW, GOOD, FAIR, POOR
                  listingType:
                    type: string
                    description: NORMAL, AUCTION
                  sellerNickname:
                    type: string
                  categoryId:
                    type: integer
                    format: int64
                  categoryName:
                    type: string
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        imageUrl:
                          type: string
                        imageType:
                          type: string
                          description: THUMBNAIL, DETAIL
                        sortOrder:
                          type: integer
                          format: int32
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                description: ProductDetailResponse
    delete:
      tags:
      - Product
      summary: 상품을 삭제합니다.
      description: ''
      parameters:
      - name: nickname
        in: header
        description: 요청한 판매자 닉네임
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: 삭제할 상품 ID
        required: true
        schema:
          type: integer
          format: int64
    patch:
      tags:
      - Product
      summary: 기존 상품 정보를 수정합니다
      description: ''
      parameters:
      - name: nickname
        in: header
        description: 요청한 판매자 닉네임
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: 수정할 상품 ID
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              required:
              - categoryId
              - description
              - images
              - listingType
              - name
              - productCondition
              - productStatus
              - startingPrice
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                startingPrice:
                  minimum: !!float '0'
                  type: number
                  format: double
                productStatus:
                  type: string
                  description: ACTIVE, INACTIVE, SOLD_OUT, AUCTION_COMPLETED, DELETED
                productCondition:
                  type: string
                  description: NEW, LIKE_NEW, GOOD, FAIR, POOR
                listingType:
                  type: string
                  description: NORMAL, AUCTION
                categoryId:
                  type: integer
                  format: int64
                images:
                  type: array
                  items:
                    required:
                    - imageType
                    - imageUrl
                    - sortOrder
                    type: object
                    properties:
                      imageUrl:
                        type: string
                      imageType:
                        type: string
                        description: THUMBNAIL, DETAIL
                      sortOrder:
                        minimum: !!float '0'
                        type: integer
                        format: int32
              description: 수정할 상품 정보
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  name:
                    type: string
                  description:
                    type: string
                  price:
                    type: number
                    format: double
                  productStatus:
                    type: string
                    description: ACTIVE, INACTIVE, SOLD_OUT, AUCTION_COMPLETED, DELETED
                  productCondition:
                    type: string
                    description: NEW, LIKE_NEW, GOOD, FAIR, POOR
                  listingType:
                    type: string
                    description: NORMAL, AUCTION
                  sellerNickname:
                    type: string
                  categoryId:
                    type: integer
                    format: int64
                  categoryName:
                    type: string
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        imageUrl:
                          type: string
                        imageType:
                          type: string
                          description: THUMBNAIL, DETAIL
                        sortOrder:
                          type: integer
                          format: int32
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                description: ProductDetailResponse
