spring:
  cloud:
    consul:
      enabled: false

  config:
    activate:
      on-profile: test

  jpa:
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    database: mysql
    hibernate:
      ddl-auto: create-drop

openapi:
  docs-export:
    enabled: false

springdoc:
  api-docs:
    enabled: false

auction:
  scheduler:
    cron: "-"

client:
  product-service:
    base-url: http://localhost:0
