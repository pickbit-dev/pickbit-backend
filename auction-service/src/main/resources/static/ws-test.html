<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction SockJS Test</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 900px; margin: 36px auto; padding: 0 16px; color: #172033; }
        .panel { border: 1px solid #d0d7e2; border-radius: 12px; padding: 16px; margin: 16px 0; background: #f8fafc; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
        label { display: flex; flex: 1; min-width: 220px; flex-direction: column; gap: 6px; font-weight: 600; }
        input { padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
        button { padding: 10px 14px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; font-weight: 700; }
        button.secondary { background: #475467; }
        button.danger { background: #dc2626; }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        code, pre { background: #e8eef8; padding: 8px; border-radius: 8px; white-space: pre-wrap; }
        #log { width: 100%; min-height: 340px; border: 0; border-radius: 12px; padding: 12px; background: #101828; color: #d6e1ff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; box-sizing: border-box; }
    </style>
</head>
<body>
<h1>Auction SockJS Test</h1>
<p>SockJS + STOMP로 <code>/api/auctions/ws</code>에 연결하고 <code>/topic/auctions/{auctionId}</code>를 구독합니다.</p>

<div class="panel">
    <div class="row">
        <label>Gateway Base URL <input id="serverUrl" type="text" value="http://192.168.20.70:18080"></label>
        <label>Auction ID <input id="auctionId" type="number" min="1" value="1"></label>
    </div>
    <pre id="preview"></pre>
    <div class="row">
        <button id="connectBtn" type="button">Connect & Subscribe</button>
        <button id="disconnectBtn" class="danger" type="button" disabled>Disconnect</button>
        <button id="clearBtn" class="secondary" type="button">Clear Log</button>
    </div>
    <strong>Status: <span id="status">DISCONNECTED</span></strong>
</div>

<div class="panel">
    <div class="row">
        <label>Bid Amount <input id="bidAmount" type="number" min="1" value="12000"></label>
        <label>Access Token Optional <input id="accessToken" type="text" placeholder="쿠키가 없을 때만 Bearer token 입력"></label>
    </div>
    <pre id="bidPreview"></pre>
    <p>입찰자 정보는 Gateway 인증 컨텍스트에서 결정됩니다. 쿠키 인증은 자동으로 포함하고, 토큰을 입력하면 Authorization 헤더를 추가합니다.</p>
    <div class="row">
        <button id="placeBidBtn" type="button">Place Bid</button>
    </div>
</div>

<div class="panel">
    <div class="row">
        <label>Event Limit <input id="eventLimit" type="number" min="1" max="100" value="50"></label>
        <label>Last Event ID <input id="lastEventId" type="text" readonly></label>
    </div>
    <pre id="eventPreview"></pre>
    <div class="row">
        <button id="loadEventsBtn" type="button">Load Events</button>
        <button id="syncMissedBtn" type="button">Sync Missed Events</button>
    </div>
</div>

<textarea id="log" readonly></textarea>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script>
    const serverUrlInput = document.getElementById('serverUrl');
    const auctionIdInput = document.getElementById('auctionId');
    const preview = document.getElementById('preview');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const clearBtn = document.getElementById('clearBtn');
    const placeBidBtn = document.getElementById('placeBidBtn');
    const bidAmountInput = document.getElementById('bidAmount');
    const accessTokenInput = document.getElementById('accessToken');
    const bidPreview = document.getElementById('bidPreview');
    const eventLimitInput = document.getElementById('eventLimit');
    const lastEventIdInput = document.getElementById('lastEventId');
    const eventPreview = document.getElementById('eventPreview');
    const loadEventsBtn = document.getElementById('loadEventsBtn');
    const syncMissedBtn = document.getElementById('syncMissedBtn');
    const statusText = document.getElementById('status');
    const logArea = document.getElementById('log');

    let stompClient = null;
    let subscription = null;
    let connecting = false;
    let lastEventId = null;
    const seenEventIds = new Set();

    function baseUrl() {
        return serverUrlInput.value.trim().replace(/\/$/, '').replace(/\/api\/auctions\/ws$/, '').replace(/\/api$/, '');
    }

    function endpoint() {
        return `${baseUrl()}/api/auctions/ws`;
    }

    function topic() {
        return `/topic/auctions/${auctionIdInput.value}`;
    }

    function log(message) {
        logArea.value += `[${new Date().toLocaleTimeString()}] ${message}\n`;
        logArea.scrollTop = logArea.scrollHeight;
    }

    function setStatus(status) {
        statusText.textContent = status;
    }

    function updatePreview() {
        preview.textContent = `SockJS endpoint: ${endpoint()}\nSubscribe topic: ${topic()}`;
        bidPreview.textContent = `POST ${baseUrl()}/api/auctions/${auctionIdInput.value}/bids\nCredentials: include\nAuthorization: ${accessTokenInput.value.trim() ? 'Bearer <token>' : '(cookie only)'}\nBody: {"bidAmount":${bidAmountInput.value}}`;
        eventPreview.textContent = `GET ${eventsUrl()}\nMissed: ${missedEventsUrl()}`;
    }

    function normalizeLimit() {
        const limit = Number(eventLimitInput.value);
        if (!limit || limit < 1) return 50;
        return Math.min(limit, 100);
    }

    function eventsUrl() {
        return `${baseUrl()}/api/auctions/${auctionIdInput.value}/events?limit=${normalizeLimit()}`;
    }

    function missedEventsUrl() {
        const after = lastEventId || '';
        return `${baseUrl()}/api/auctions/${auctionIdInput.value}/events?afterEventId=${after}&limit=${normalizeLimit()}`;
    }

    function updateLastEventId(eventId) {
        if (eventId == null) return;
        lastEventId = eventId;
        lastEventIdInput.value = String(eventId);
        updatePreview();
    }

    function handleAuctionEvent(event, source) {
        if (event.eventId != null && seenEventIds.has(event.eventId)) {
            log(`${source} duplicate event ignored: eventId=${event.eventId}`);
            return;
        }
        if (event.eventId != null) {
            seenEventIds.add(event.eventId);
            updateLastEventId(event.eventId);
        }
        log(`${source} event ${event.eventId ?? 'no-id'} ${event.eventType}`);
        log(JSON.stringify(event, null, 2));
    }

    function connect() {
        if (connecting || (stompClient && stompClient.active)) {
            log('already connecting or connected');
            return;
        }
        connecting = true;
        setStatus('CONNECTING');
        log(`connect SockJS: ${endpoint()}`);

        stompClient = new StompJs.Client({
            reconnectDelay: 0,
            webSocketFactory: () => new SockJS(endpoint()),
            debug: (message) => log(`[stomp] ${message}`),
            onConnect: () => {
                connecting = false;
                setStatus('CONNECTED');
                log('connected');
                subscription = stompClient.subscribe(topic(), (frame) => {
                    log(`message from ${topic()}`);
                    handleAuctionEvent(JSON.parse(frame.body), 'ws');
                });
                log(`subscribed: ${topic()}`);
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            },
            onStompError: (frame) => {
                connecting = false;
                setStatus('STOMP ERROR');
                log(`broker error: ${frame.headers.message || 'unknown'}`);
                if (frame.body) log(frame.body);
            },
            onWebSocketClose: (event) => {
                connecting = false;
                setStatus('DISCONNECTED');
                log(`socket closed: code=${event.code}, reason=${event.reason || 'none'}`);
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            },
            onWebSocketError: () => {
                connecting = false;
                setStatus('SOCKET ERROR');
                log('socket error');
            }
        });
        stompClient.activate();
    }

    async function disconnect() {
        if (subscription) {
            subscription.unsubscribe();
            subscription = null;
        }
        if (stompClient) {
            await stompClient.deactivate();
            stompClient = null;
        }
        connecting = false;
        setStatus('DISCONNECTED');
        log('disconnected');
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
    }

    async function placeBid() {
        const auctionId = auctionIdInput.value;
        const bidAmount = Number(bidAmountInput.value);
        const accessToken = accessTokenInput.value.trim();

        if (!auctionId) {
            log('bid failed: auctionId is required');
            return;
        }
        if (!bidAmount || bidAmount <= 0) {
            log('bid failed: bidAmount must be greater than 0');
            return;
        }

        const url = `${baseUrl()}/api/auctions/${auctionId}/bids`;
        log(`REST POST ${url}`);

        try {
            placeBidBtn.disabled = true;
            const headers = {
                'Content-Type': 'application/json'
            };
            if (accessToken) {
                headers.Authorization = `Bearer ${accessToken}`;
            }
            const response = await fetch(url, {
                method: 'POST',
                credentials: 'include',
                headers,
                body: JSON.stringify({bidAmount})
            });
            const contentType = response.headers.get('content-type') || '';
            const body = contentType.includes('application/json')
                ? JSON.stringify(await response.json(), null, 2)
                : await response.text();

            log(`REST response: ${response.status} ${response.statusText}`);
            if (body) log(body);
        } catch (error) {
            log(`REST error: ${error.message}`);
        } finally {
            placeBidBtn.disabled = false;
        }
    }

    async function fetchEvents(url, source) {
        log(`REST GET ${url}`);
        try {
            const response = await fetch(url);
            const body = await response.json();
            log(`REST response: ${response.status} ${response.statusText}`);
            if (!Array.isArray(body)) {
                log(JSON.stringify(body, null, 2));
                return;
            }
            log(`${source} events count: ${body.length}`);
            for (const event of body) {
                handleAuctionEvent(event, source);
            }
        } catch (error) {
            log(`REST error: ${error.message}`);
        }
    }

    function loadEvents() {
        seenEventIds.clear();
        lastEventId = null;
        lastEventIdInput.value = '';
        fetchEvents(eventsUrl(), 'history');
    }

    function syncMissedEvents() {
        if (!lastEventId) {
            log('sync skipped: lastEventId is empty');
            return;
        }
        fetchEvents(missedEventsUrl(), 'missed');
    }

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
    placeBidBtn.addEventListener('click', placeBid);
    loadEventsBtn.addEventListener('click', loadEvents);
    syncMissedBtn.addEventListener('click', syncMissedEvents);
    clearBtn.addEventListener('click', () => logArea.value = '');
    serverUrlInput.addEventListener('input', updatePreview);
    auctionIdInput.addEventListener('input', updatePreview);
    bidAmountInput.addEventListener('input', updatePreview);
    accessTokenInput.addEventListener('input', updatePreview);
    eventLimitInput.addEventListener('input', updatePreview);
    updatePreview();
</script>
</body>
</html>
