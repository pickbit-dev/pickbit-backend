spring:
  config:
    import: optional:file:./secrets/application-deploy-secret.yml
    activate:
      on-profile: deploy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${AUCTION_MYSQL_USERNAME}
    password: ${AUCTION_MYSQL_PASSWORD}
    url: ${AUCTION_MYSQL_URL}

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    consul:
      enabled: true
      host: consul-server
      port: 8500

  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate

client:
  product-service:
    base-url: http://product-service:18083
  user-service:
    base-url: http://user-service:18082

auction:
  scheduler:
    cron: "0 * * * * *"
  cache:
    auction-ttl-seconds: 10

resilience4j:
  circuitbreaker:
    instances:
      productService:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      userService:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  bulkhead:
    instances:
      productService:
        maxConcurrentCalls: 30
        maxWaitDuration: 100ms
      userService:
        maxConcurrentCalls: 30
        maxWaitDuration: 100ms

server:
  port: 18085

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
