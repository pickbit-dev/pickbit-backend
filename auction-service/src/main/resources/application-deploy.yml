spring:
  config:
    activate:
      on-profile: deploy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${AUCTION_MYSQL_USERNAME}
    password: ${AUCTION_MYSQL_PASSWORD}
    url: ${AUCTION_MYSQL_URL}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  cloud:
    consul:
      enabled: true
      host: ${CONSUL_HOST:consul-server}
      port: ${CONSUL_PORT:18500}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate

client:
  product-service:
    base-url: ${PRODUCT_SERVICE_BASE_URL:http://product-service}

auction:
  scheduler:
    cron: ${AUCTION_SCHEDULER_CRON:0 * * * * *}
  cache:
    auction-ttl-seconds: ${AUCTION_CACHE_TTL_SECONDS:10}

resilience4j:
  circuitbreaker:
    instances:
      productService:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  bulkhead:
    instances:
      productService:
        maxConcurrentCalls: 30
        maxWaitDuration: 100ms

server:
  port: ${AUCTION_SERVER_PORT:18085}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
