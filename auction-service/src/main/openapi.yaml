openapi: 3.0.1
info:
  title: pickbit-backend.auction-service.main
  description: ''
  version: ''
paths:
  /auctions:
    get:
      tags:
      - Auction
      summary: 경매 목록을 페이징 조회합니다.
      description: ''
      parameters:
      - name: status
        in: query
        description: 경매 상태 필터 (선택). null이면 전체 조회 (SCHEDULED, ACTIVE, ENDED, CANCELLED)
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
          format: int32
      - name: sort
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: array
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          format: int64
                        productId:
                          type: integer
                          format: int64
                        productName:
                          type: string
                        productThumbnailUrl:
                          type: string
                        sellerNickname:
                          type: string
                        currentPrice:
                          type: number
                          format: double
                        auctionStatus:
                          type: string
                          description: SCHEDULED, ACTIVE, ENDED, CANCELLED
                        endTime:
                          type: string
                          format: date-time
                        createdAt:
                          type: string
                          format: date-time
                  page:
                    type: integer
                    format: int32
                  size:
                    type: integer
                    format: int32
                  totalElements:
                    type: integer
                    format: int64
                  totalPages:
                    type: integer
                    format: int32
                  first:
                    type: boolean
                  last:
                    type: boolean
                description: PageResponse
    post:
      tags:
      - Auction
      summary: 새 경매를 생성합니다.
      description: <p>요청자가 해당 상품의 판매자여야 하며, 상품은상태이고이이어야 합니다.
      parameters:
      - name: nickname
        in: header
        description: 판매자 닉네임 (요청 헤더)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - endTime
              - minimumBidIncrement
              - productId
              - startTime
              - startingPrice
              type: object
              properties:
                productId:
                  type: integer
                  format: int64
                startingPrice:
                  minimum: !!float '0'
                  type: number
                  format: double
                buyNowPrice:
                  minimum: !!float '0'
                  type: number
                  format: double
                minimumBidIncrement:
                  minimum: !!float '0'
                  type: number
                  format: double
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
              description: 경매 생성 요청 데이터
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  productId:
                    type: integer
                    format: int64
                  productName:
                    type: string
                  productThumbnailUrl:
                    type: string
                  sellerNickname:
                    type: string
                  startingPrice:
                    type: number
                    format: double
                  currentPrice:
                    type: number
                    format: double
                  buyNowPrice:
                    type: number
                    format: double
                  minimumBidIncrement:
                    type: number
                    format: double
                  auctionStatus:
                    type: string
                    description: SCHEDULED, ACTIVE, ENDED, CANCELLED
                  startTime:
                    type: string
                    format: date-time
                  endTime:
                    type: string
                    format: date-time
                  winnerNickname:
                    type: string
                  finalPrice:
                    type: number
                    format: double
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                description: AuctionDetailResponse
  /auctions/{auctionId}:
    get:
      tags:
      - Auction
      summary: 경매 상세 정보를 조회합니다.
      description: ''
      parameters:
      - name: auctionId
        in: path
        description: 경매 ID
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  productId:
                    type: integer
                    format: int64
                  productName:
                    type: string
                  productThumbnailUrl:
                    type: string
                  sellerNickname:
                    type: string
                  startingPrice:
                    type: number
                    format: double
                  currentPrice:
                    type: number
                    format: double
                  buyNowPrice:
                    type: number
                    format: double
                  minimumBidIncrement:
                    type: number
                    format: double
                  auctionStatus:
                    type: string
                    description: SCHEDULED, ACTIVE, ENDED, CANCELLED
                  startTime:
                    type: string
                    format: date-time
                  endTime:
                    type: string
                    format: date-time
                  winnerNickname:
                    type: string
                  finalPrice:
                    type: number
                    format: double
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                description: AuctionDetailResponse
    delete:
      tags:
      - Auction
      summary: 경매를 취소합니다.
      description: 상태의 경매만 취소할 수 있으며,요청자가 해당 경매의 판매자여야 합니다.
      parameters:
      - name: nickname
        in: header
        description: 판매자 닉네임 (요청 헤더)
        required: true
        schema:
          type: string
      - name: auctionId
        in: path
        description: 취소할 경매 ID
        required: true
        schema:
          type: integer
          format: int64
