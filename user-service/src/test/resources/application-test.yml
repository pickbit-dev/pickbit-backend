spring:
  config:
    activate:
      on-profile: test

  cloud:
    consul:
      enabled: false

  jpa:
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    database: mysql
    # 스키마는 Flyway 가 만들고 Hibernate 는 검증만 한다.
    # 마이그레이션과 엔티티가 어긋나면 여기서 기동이 실패해 CI 가 잡아준다.
    hibernate:
      ddl-auto: validate

  kafka:
    listener:
      auto-startup: false

openapi:
  docs-export:
    enabled: false

springdoc:
  api-docs:
    enabled: false
