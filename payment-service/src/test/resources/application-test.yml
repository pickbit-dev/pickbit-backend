spring:
  config:
    activate:
      on-profile: test

  cloud:
    consul:
      enabled: false

  jpa:
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    database: mysql
    hibernate:
      ddl-auto: validate

  kafka:
    listener:
      auto-startup: false

  batch:
    job:
      enabled: false
    # BATCH_* 메타 테이블은 Flyway 마이그레이션(V1__init_schema.sql)에 들어 있다.
    # 테스트도 프로덕션과 같은 경로로 스키마를 만들어야 마이그레이션 오류를 CI 가 잡는다.
    jdbc:
      initialize-schema: never

openapi:
  docs-export:
    enabled: false

springdoc:
  api-docs:
    enabled: false

# application.yml 이 기본값 없이 환경변수를 요구하는 값들이다.
# 실제 PG 를 호출하는 테스트는 없고 컨텍스트 기동에만 필요한 자리채움이다.
client:
  toss-payments:
    base-url: http://localhost:0
    secret-key: test-secret-key
    success-url: http://localhost:3000/payment/success
    fail-url: http://localhost:3000/payment/fail
    webhook-secret: test-webhook-secret

payment:
  # 테스트 도중 스케줄러가 끼어들어 데이터를 바꾸지 않게 막는다.
  settlement-batch:
    cron: "-"
  confirm-scheduler:
    cron: "-"
  expiry-scheduler:
    cron: "-"
