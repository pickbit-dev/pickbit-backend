spring:
  config:
    import: optional:file:./secrets/application-deploy-secret.yml
    activate:
      on-profile: deploy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${PAYMENT_MYSQL_USERNAME}
    password: ${PAYMENT_MYSQL_PASSWORD}
    url: ${PAYMENT_MYSQL_URL}

  jpa:
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        use_sql_comments: false
        default_batch_fetch_size: 100
    database: mysql
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: kafka:9092

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    consul:
      enabled: true
      host: consul-server
      port: 8500

server:
  port: 18086

payment:
  deadline-hours: 24
  confirm-timeout-days: 7
  expiry-scheduler:
    cron: "0 * * * * *"
  confirm-scheduler:
    cron: "0 * * * * *"
  settlement-batch:
    cron: ${SETTLEMENT_BATCH_CRON:0 */10 * * * *}
    chunk-size: ${SETTLEMENT_BATCH_CHUNK_SIZE:100}
    platform-fee-rate: ${SETTLEMENT_PLATFORM_FEE_RATE:0.05}
    pg-fee-rate: ${SETTLEMENT_PG_FEE_RATE:0.00}
    # 실패한 정산의 재시도 상한. 넘으면 배치가 더 집어가지 않고 사람이 확인해야 한다.
    max-retries: ${SETTLEMENT_BATCH_MAX_RETRIES:5}

client:
  toss-payments:
    base-url: ${TOSS_BASE_URL}
    secret-key: ${TOSS_SECRET_KEY}
    success-url: ${TOSS_SUCCESS_URL}
    fail-url: ${TOSS_FAIL_URL}
    webhook-secret: ${TOSS_WEBHOOK_SECRET}
    connect-timeout-ms: 500
    read-timeout-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      tossPayments:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  bulkhead:
    instances:
      tossPayments:
        maxConcurrentCalls: 32
        maxWaitDuration: 100ms

openapi:
  docs-export:
    enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
