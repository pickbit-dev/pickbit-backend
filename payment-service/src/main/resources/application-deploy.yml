spring:
  config:
    import: optional:file:./secrets/application-deploy-secret.yml
    activate:
      on-profile: deploy

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${PAYMENT_MYSQL_USERNAME}
    password: ${PAYMENT_MYSQL_PASSWORD}
    url: ${PAYMENT_MYSQL_URL}

  jpa:
    database: mysql
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: kafka:9092

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    consul:
      enabled: true
      host: consul-server
      port: 8500

server:
  port: 18086

payment:
  deadline-hours: 24
  confirm-timeout-days: 10
  expiry-scheduler:
    cron: "0 * * * * *"

client:
  toss-payments:
    base-url: ${TOSS_BASE_URL}
    secret-key: ${TOSS_SECRET_KEY}
    success-url: ${TOSS_SUCCESS_URL}
    fail-url: ${TOSS_FAIL_URL}
    webhook-secret: ${TOSS_WEBHOOK_SECRET}
    connect-timeout-ms: 500
    read-timeout-ms: 5000

resilience4j:
  circuitbreaker:
    instances:
      tossPayments:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
  bulkhead:
    instances:
      tossPayments:
        maxConcurrentCalls: 32
        maxWaitDuration: 100ms

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
