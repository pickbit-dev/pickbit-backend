spring:
  application:
    name: payment-service

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: ${BATCH_JDBC_INITIALIZE_SCHEMA:never}

  cloud:
    consul:
      discovery:
        service-name: payment-service
        health-check-path: /actuator/health
        health-check-interval: 10s
        metadata:
          gateway-path: /api/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

client:
  toss-payments:
    base-url: ${TOSS_BASE_URL}
    secret-key: ${TOSS_SECRET_KEY}
    success-url: ${TOSS_SUCCESS_URL}
    fail-url: ${TOSS_FAIL_URL}
    webhook-secret: ${TOSS_WEBHOOK_SECRET}

payment:
  settlement-batch:
    cron: ${SETTLEMENT_BATCH_CRON:0 0/10 * * * *}
    chunk-size: ${SETTLEMENT_BATCH_CHUNK_SIZE:100}
    platform-fee-rate: ${SETTLEMENT_PLATFORM_FEE_RATE:0.05}
    pg-fee-rate: ${SETTLEMENT_PG_FEE_RATE:0.00}
