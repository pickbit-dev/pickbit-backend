rootProject.name = 'pickbit-backend'

include 'library'
include 'logging-library'
include 'user-service'
include 'auth-service'
include 'product-service'
include 'auction-service'
include 'payment-service'
include 'notification-service'
include 'file-service'
include 'gateway-service'

// load-test 는 Gatling 부하 테스트 전용 모듈이라 서비스 이미지에는 들어갈 필요가 없다.
// Dockerfile 이 이 디렉터리를 복사하지 않는데, 무조건 include 하면 Gradle 이 설정 단계에서
// "Configuring project ':load-test' without an existing directory is not allowed" 로 죽는다.
// 로컬/CI 체크아웃에는 디렉터리가 있으므로 그대로 포함된다.
if (file('load-test').isDirectory()) {
    include 'load-test'
}
