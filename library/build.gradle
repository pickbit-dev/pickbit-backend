plugins {
    id 'java-library'
}

description = 'Shared library - common DTOs, exceptions, utilities'
version = '0.0.1-SNAPSHOT'

dependencies {
    api 'org.springframework.data:spring-data-commons'
    api 'org.springframework.data:spring-data-jpa'
    api 'jakarta.persistence:jakarta.persistence-api'

    // 스키마는 Flyway 가 관리하고 Hibernate 는 validate 만 한다.
    // DataSource 가 없는 서비스(file, gateway)에서는 Flyway 자동설정이 스스로 물러난다.
    //
    // 세 개가 다 필요하다.
    //   flyway-core        : 엔진
    //   flyway-mysql       : MySQL 8.4 지원 (별도 모듈)
    //   spring-boot-flyway : 자동설정. Boot 4 는 자동설정을 기술별 모듈로 쪼개서
    //                        flyway-core 만 넣으면 마이그레이션이 조용히 실행되지 않는다.
    api 'org.flywaydb:flyway-core'
    api 'org.flywaydb:flyway-mysql'
    api 'org.springframework.boot:spring-boot-flyway'
    api 'jakarta.servlet:jakarta.servlet-api'
    api 'jakarta.validation:jakarta.validation-api'
    api 'org.springframework:spring-webmvc'
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'net.logstash.logback:logstash-logback-encoder:9.0'
    api 'org.codehaus.janino:janino:3.1.12'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Kafka 를 소비하는 서비스에서만 쓰인다. 라이브러리에 전이시키지 않는다.
    compileOnly 'org.springframework.boot:spring-boot-starter-kafka'

    implementation 'com.slack.api:slack-api-client:1.45.3'
    implementation("io.github.openfeign.querydsl:querydsl-jpa:6.11")
    annotationProcessor("io.github.openfeign.querydsl:querydsl-apt:6.11:jakarta")

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.test {
    useJUnitPlatform()
}
