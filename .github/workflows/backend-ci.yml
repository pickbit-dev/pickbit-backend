name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Test and validate compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Validate deploy compose
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: docker compose -f docker-compose.deploy.yml config --quiet
