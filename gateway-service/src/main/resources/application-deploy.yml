spring:
  config:
    import: optional:file:./secrets/application-deploy-secret.yml
    activate:
      on-profile: deploy

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    consul:
      enabled: true
      host: consul-server
      port: 8500
      discovery:
        service-name: gateway-service
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: 18080

cors:
  allowed-origins:
    - ${CORS_ALLOWED_ORIGIN}
