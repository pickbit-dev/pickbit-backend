spring:
  config:
    import: optional:file:./secrets/application-deploy-secret.yml
    activate:
      on-profile: deploy

  data:
    redis:
      host: redis
      port: 6379

  cloud:
    consul:
      enabled: true
      host: consul-server
      port: 8500
      discovery:
        service-name: gateway-service
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: 18080

gateway:
  api-key:
    # 운영 환경이므로 기본 비활성이다. 부하 테스트처럼 필요한 때만 .env 로 켜고 끝나면 되돌린다.
    # 이 키가 있으면 JWT 없이 임의 사용자로 API를 호출할 수 있다.
    enabled: ${GATEWAY_API_KEY_ENABLED:false}
    key: ${GATEWAY_API_KEY:}
    # 운영에서는 ADMIN 역할 사용을 막는다. 키가 유출돼도 권한 상승은 불가능하게 둔다.
    allow-admin-role: ${GATEWAY_API_KEY_ALLOW_ADMIN:false}

cors:
  allowed-origins:
    - https://pickbit.co.kr
    - https://www.pickbit.co.kr
