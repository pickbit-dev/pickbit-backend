spring:
  config:
    activate:
      on-profile: develop

  cloud:
    consul:
      enabled: true
      host: localhost
      port: 18500
      discovery:
        service-name: gateway-service
        health-check-path: /actuator/health
        health-check-interval: 10s

server:
  port: 18080

cors:
  allowed-origins:
    - "http://localhost:*"
    - "http://127.0.0.1:*"
    - "http://192.168.20.70:*"
