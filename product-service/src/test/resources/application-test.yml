spring:
  ai:
    openai:
      api-key: test-openai-api-key
      chat:
        model: gpt-4o-mini
        temperature: 0.7

  cloud:
    consul:
      enabled: false

  config:
    activate:
      on-profile: test

  jpa:
    defer-datasource-initialization: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100
    database: mysql
    hibernate:
      ddl-auto: create-drop

  kafka:
    listener:
      auto-startup: false

openapi:
  docs-export:
    enabled: false

springdoc:
  api-docs:
    enabled: false
