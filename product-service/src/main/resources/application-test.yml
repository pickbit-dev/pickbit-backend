spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:product-service;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: false

server:
  port: 8082
